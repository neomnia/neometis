[project]
name = "neometis"
version = "0.2.0"
description = "The Lean, Single-Tenant AI Workbench powered by Hermes Agent & Advanced RAG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "qdrant-client>=1.10,<2.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "chainlit>=2.0,<3.0",
  "pypdf>=5.0,<6.0",
  "rich>=13.0,<14.0",
]

[project.scripts]
neometis = "src.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
