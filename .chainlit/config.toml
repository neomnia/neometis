[project]
# Chainlit UI — NéoMêtis workbench
name = "neometis"
enable_telemetry = false
user_env = []
session_timeout = 3600
cache = false

[UI]
name = "NéoMêtis"
description = "The Lean, Single-Tenant AI Workbench powered by Hermes Agent & Advanced RAG"
default_collapse_content = true
default_expand_messages = false
hide_cot = false

[features]
spontaneous_file_upload = true

[features.spontaneous_file_upload]
accept = ["text/plain", "application/pdf", "application/json", "text/markdown"]
max_files = 10
max_size_mb = 50
