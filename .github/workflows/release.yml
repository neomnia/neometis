name: Release

# Automatic pre-release on every branch push so evolution is traceable per branch/commit.
on:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        env:
          BASE_VERSION: ${{ hashFiles('VERSION') != '' && '' || '0.0.0' }}
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          BRANCH="${GITHUB_REF_NAME}"
          BRANCH_SLUG=$(echo "$BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          SHA="${GITHUB_SHA:0:7}"
          RUN="${GITHUB_RUN_NUMBER}"

          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            TAG="v${BASE}"
            NAME="NéoMêtis v${BASE} (${SHA})"
            PRERELEASE=false
          else
            TAG="v${BASE}-${BRANCH_SLUG}.${SHA}"
            NAME="NéoMêtis v${BASE} · ${BRANCH} · ${SHA} (#${RUN})"
            PRERELEASE=true
          fi

          FULL_VERSION="${BASE}+${BRANCH_SLUG}.${SHA}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Write build version artifact
        run: |
          mkdir -p dist
          cat > dist/version.json <<EOF
          {
            "version": "${{ steps.meta.outputs.full_version }}",
            "base": "$(cat VERSION | tr -d '[:space:]')",
            "branch": "${{ steps.meta.outputs.branch }}",
            "sha": "${{ steps.meta.outputs.sha }}",
            "tag": "${{ steps.meta.outputs.tag }}"
          }
          EOF

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: dist/version.json
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
