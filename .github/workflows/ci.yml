name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "from src.api.main import app; from src.neometis.version import __version__; print(__version__)"
          python -c "from src.core.hermes import HermesAgent, upstream_available; print(upstream_available())"

      - name: Smoke test API
        run: |
          uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          sleep 2
          curl -sf http://127.0.0.1:8000/health
          curl -N -sf -X POST http://127.0.0.1:8000/api/chat/stream \
            -H "Content-Type: application/json" \
            -d '{"message":"ci smoke"}' | head -5

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install & build
        run: |
          npm ci
          npm run build
